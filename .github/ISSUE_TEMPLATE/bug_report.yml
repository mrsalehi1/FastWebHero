name: Bug report
description: Report a reproducible problem with the builder.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Do not include credentials or other secrets.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Change ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit SHA or release version
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version
      placeholder: Windows 11, Node.js 20
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove access keys, bucket credentials, and other secrets.
      render: shell
